blueprint:
  name: Petra Trip Tracker – trip notifications
  description: >-
    Push notifications and/or spoken announcements for school / service transport trips
    tracked by the Petra Trip Tracker integration: car on its way, at pickup, picked up,
    arrived, cancelled, no car assigned shortly before pickup, ETA updates, and problems
    with the tracking itself.


    It triggers only on the integration's events, which are not re-sent when Home
    Assistant restarts, so restarts do not cause notifications.
  domain: automation
  source_url: https://github.com/jjpp/petra-tracker/blob/main/blueprints/automation/petra_tracker/trip_notifications.yaml
  homeassistant:
    min_version: "2025.1.0"
  input:
    notify_on:
      name: Notify about
      description: >-
        "No car assigned" fires once per trip when it is still only booked shortly before
        pickup (the lead time is an integration option, default 1 minute) or after the
        pickup time has passed. ETA updates fire whenever the ETA changes by at least the
        integration's ETA granularity (default 1 minute) — chatty for push, nice for speakers.
      default:
        - approaching
        - at_pickup
        - onboard
        - finished
        - cancelled
        - car_not_assigned
        - connection_degraded
        - token_expiring
        - schema_drift
      selector:
        select:
          multiple: true
          options:
            - label: Car on its way
              value: approaching
            - label: Car at pickup
              value: at_pickup
            - label: Picked up
              value: onboard
            - label: Arrived (trip finished)
              value: finished
            - label: Trip cancelled
              value: cancelled
            - label: No car assigned shortly before / after pickup time
              value: car_not_assigned
            - label: ETA changed
              value: eta_changed
            - label: Periodic update during a trip (heartbeat, if enabled in the integration)
              value: heartbeat
            - label: Tracking has no connection
              value: connection_degraded
            - label: Login token expires soon
              value: token_expiring
            - label: The service's API changed
              value: schema_drift
    person_name:
      name: Only for this child (optional)
      description: >-
        First name as shown in Home Assistant. Leave empty for all children. Account-level
        messages (connection, token, API changes) are always sent.
      default: ""
      selector:
        text:
    notify_action:
      name: Push notification action (optional)
      description: >-
        For example notify.mobile_app_my_phone. Leave empty for no push notification.
      default: ""
      selector:
        text:
    title:
      name: Notification title
      description: 'Placeholders work here too, e.g. "{child}: school transport".'
      default: School transport
      selector:
        text:
    tts_entity:
      name: Text-to-speech engine (optional)
      description: Leave empty for no spoken announcements.
      default: ""
      selector:
        entity:
          filter:
            - domain: tts
    media_players:
      name: Speakers for announcements (optional)
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: media_player
    messages:
      name: Message texts
      icon: mdi:message-text-outline
      collapsed: true
      description: >-
        The text of each message. Placeholders are replaced with the trip's details
        (also in the notification title): {child} first name, {eta} minutes to the next
        stop, {old_eta} previous ETA, {leg} "pickup" or "destination", {status} trip status
        in words, {car} car number, {pickup_time} scheduled pickup time (HH:MM),
        {distance} how far the car still is from the stop (e.g. "850 m", "3.2 km";
        drivers sometimes press "arrived" early), {arrival_time} estimated arrival when
        a trip was ended before the destination,
        {minutes} minutes before/after the pickup time, {failed_minutes} minutes without
        connection, {days} days until the token expires, {severity} kind of API change.
        A placeholder without a value becomes the "missing value" text ("?"); words, the
        missing-value text and the time format can be changed under "Words and formats".
        Empty a text to never send that message.
      input:
        msg_approaching:
          name: Car on its way
          default: "{child}'s taxi is on its way, about {eta} min."
          selector:
            text:
        msg_at_pickup:
          name: Car at pickup
          default: "{child}'s taxi has arrived."
          selector:
            text:
        msg_onboard:
          name: Picked up
          default: "{child} has been picked up."
          selector:
            text:
        msg_finished:
          name: Arrived
          default: "{child} has arrived."
          selector:
            text:
        msg_finished_away:
          name: Trip ended before the destination
          description: >-
            The driver ended the trip while the car was still more than 500 m from the
            destination. The car is not tracked after that; {arrival_time} is an estimate.
          default: "{child}'s trip was ended {distance} from the destination; expected around {arrival_time}."
          selector:
            text:
        msg_cancelled:
          name: Trip cancelled
          default: "{child}'s trip was cancelled."
          selector:
            text:
        msg_car_not_assigned:
          name: No car assigned shortly before pickup
          default: "No car assigned yet for {child}'s pickup in {minutes} min."
          selector:
            text:
        msg_car_not_assigned_late:
          name: Pickup time passed, no car assigned
          default: "{child}'s pickup time {pickup_time} has passed and no car is assigned yet."
          selector:
            text:
        msg_eta_changed:
          name: ETA changed
          default: "{child}'s taxi: {eta} min to {leg}."
          selector:
            text:
        msg_heartbeat:
          name: Periodic update
          default: "{child}'s taxi: {status}, {eta} min."
          selector:
            text:
        msg_connection_degraded:
          name: Tracking has no connection
          default: "Taxi tracking has had no connection for {failed_minutes} min."
          selector:
            text:
        msg_token_expiring:
          name: Login token expires soon
          default: "Taxi tracking: the login token expires in {days} days."
          selector:
            text:
        msg_schema_drift:
          name: The service's API changed
          default: "Taxi tracking: the service's API changed ({severity}); updates may be wrong."
          selector:
            text:
    words:
      name: Words and formats
      icon: mdi:translate
      collapsed: true
      description: >-
        The words the {status}, {leg} and {severity} placeholders are replaced with, the
        text for a missing value, and how {pickup_time} is formatted. Change these to
        translate the messages.
      input:
        word_scheduled:
          name: 'Status "scheduled"'
          default: scheduled
          selector:
            text:
        word_approaching:
          name: 'Status "car on its way"'
          default: on its way
          selector:
            text:
        word_at_pickup:
          name: 'Status "car at pickup"'
          default: at pickup
          selector:
            text:
        word_onboard:
          name: 'Status "picked up"'
          default: on board
          selector:
            text:
        word_finished:
          name: 'Status "arrived"'
          default: arrived
          selector:
            text:
        word_cancelled:
          name: 'Status "cancelled"'
          default: cancelled
          selector:
            text:
        word_unknown:
          name: 'Status "unknown"'
          default: unknown
          selector:
            text:
        word_leg_pickup:
          name: 'Next stop "pickup"'
          default: pickup
          selector:
            text:
        word_leg_destination:
          name: 'Next stop "destination"'
          default: destination
          selector:
            text:
        word_severity_warning:
          name: 'API change "warning" (unexpected values)'
          default: warning
          selector:
            text:
        word_severity_breaking:
          name: 'API change "breaking" (incompatible)'
          default: breaking
          selector:
            text:
        decimal_separator:
          name: Decimal separator in {distance}
          default: "."
          selector:
            text:
        missing_value:
          name: Missing value
          description: Used when a placeholder has no value.
          default: "?"
          selector:
            text:
        time_format:
          name: Time format for {pickup_time}
          description: >-
            strftime format in Home Assistant's time zone, e.g. %H:%M (14:05),
            %H.%M (14.05) or %-I:%M %p (2:05 PM).
          default: "%H:%M"
          selector:
            text:

mode: queued
max: 10

triggers:
  - trigger: event
    event_type:
      - petra_tracker_state_changed
      - petra_tracker_car_not_assigned
      - petra_tracker_eta_changed
      - petra_tracker_heartbeat
      - petra_tracker_connection_degraded
      - petra_tracker_token_expiring
      - petra_tracker_schema_drift

variables:
  notify_on: !input notify_on
  person_filter: !input person_name
  notify_action: !input notify_action
  title: !input title
  tts_entity: !input tts_entity
  media_players: !input media_players
  ev: "{{ trigger.event.data }}"
  kind: >-
    {% set t = trigger.event.event_type | replace('petra_tracker_', '') %}
    {{ ev.new_status if t == 'state_changed' else t }}
  who: "{{ ev.get('person_name') or 'The child' }}"
  texts:
    approaching: !input msg_approaching
    at_pickup: !input msg_at_pickup
    onboard: !input msg_onboard
    finished: !input msg_finished
    finished_away: !input msg_finished_away
    cancelled: !input msg_cancelled
    car_not_assigned: !input msg_car_not_assigned
    car_not_assigned_late: !input msg_car_not_assigned_late
    eta_changed: !input msg_eta_changed
    heartbeat: !input msg_heartbeat
    connection_degraded: !input msg_connection_degraded
    token_expiring: !input msg_token_expiring
    schema_drift: !input msg_schema_drift
  text_key: >-
    {% if kind == 'car_not_assigned' and ev.get('pickup_passed') %}car_not_assigned_late
    {%- elif kind == 'finished' and ev.get('ended_at_destination') == false %}finished_away
    {%- else %}{{ kind }}{% endif %}
  words:
    status:
      scheduled: !input word_scheduled
      approaching: !input word_approaching
      at_pickup: !input word_at_pickup
      onboard: !input word_onboard
      finished: !input word_finished
      cancelled: !input word_cancelled
      unknown: !input word_unknown
    leg:
      to_pickup: !input word_leg_pickup
      to_destination: !input word_leg_destination
    severity:
      warning: !input word_severity_warning
      breaking: !input word_severity_breaking
  missing: !input missing_value
  decimal_separator: !input decimal_separator
  time_format: !input time_format
  # Each placeholder's value; missing values become the "missing value" text.
  placeholders:
    "{child}": "{{ who }}"
    "{eta}": >-
      {% set eta = ev.get('new_eta') if kind == 'eta_changed' else ev.get('eta_minutes') %}
      {{ missing if eta is none else eta }}
    "{old_eta}": "{{ ev.get('old_eta', missing) }}"
    "{leg}": "{{ words.leg.get(ev.get('leg'), missing) }}"
    "{status}": >-
      {% set s = ev.get('status') or ev.get('new_status') %}
      {{ words.status.get(s, s) if s else missing }}
    "{car}": "{{ ev.get('car_no') or missing }}"
    "{pickup_time}": >-
      {% set p = as_datetime(ev.get('scheduled_pickup')) if ev.get('scheduled_pickup') else none %}
      {{ as_local(p).strftime(time_format) if p else missing }}
    "{minutes}": >-
      {{ (ev.get('minutes_to_pickup') | abs) if ev.get('minutes_to_pickup') is not none else missing }}
    "{failed_minutes}": >-
      {{ ((ev.get('failed_for_s') / 60) | round(0) | int) if ev.get('failed_for_s') is not none else missing }}
    "{distance}": >-
      {% set m = ev.get('end_distance_m') if text_key == 'finished_away' else ev.get('distance_m') %}
      {% if m is none %}{{ missing }}
      {%- elif m < 1000 %}{{ (m / 10) | round(0) | int * 10 }} m
      {%- else %}{{ ('%.1f' | format(m / 1000)) | replace('.', decimal_separator) }} km{% endif %}
    "{arrival_time}": >-
      {% set a = as_datetime(ev.get('estimated_arrival')) if ev.get('estimated_arrival') else none %}
      {{ as_local(a).strftime(time_format) if a else missing }}
    "{days}": "{{ ev.get('days_left', missing) }}"
    "{severity}": >-
      {% set sev = ev.get('severity') %}
      {{ words.severity.get(sev, sev) if sev else missing }}
  message: >-
    {%- set ns = namespace(text=texts.get(text_key) or '') -%}
    {%- for k, v in placeholders.items() %}{% set ns.text = ns.text | replace(k, v | string) %}{% endfor -%}
    {{ ns.text }}
  notify_title: >-
    {%- set ns = namespace(text=title or '') -%}
    {%- for k, v in placeholders.items() %}{% set ns.text = ns.text | replace(k, v | string) %}{% endfor -%}
    {{ ns.text }}

conditions:
  - condition: template
    value_template: "{{ kind in notify_on and message | trim != '' }}"
  # Child filter (account-level events have no person and always pass).
  - condition: template
    value_template: >-
      {{ person_filter | trim == '' or ev.person_name is not defined
         or (ev.person_name or '') | lower == person_filter | trim | lower }}
  # New, unknown *fields* are harmless; only notify about real API problems.
  - condition: template
    value_template: "{{ kind != 'schema_drift' or ev.severity != 'info' }}"

actions:
  - if:
      - condition: template
        value_template: "{{ notify_action | trim != '' }}"
    then:
      - action: "{{ notify_action | trim }}"
        data:
          title: "{{ notify_title }}"
          message: "{{ message }}"
  - if:
      - condition: template
        value_template: "{{ tts_entity != '' and media_players | count > 0 }}"
    then:
      - action: tts.speak
        target:
          entity_id: "{{ tts_entity }}"
        data:
          media_player_entity_id: "{{ media_players }}"
          message: "{{ message }}"
