name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  version:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: manifest.json and pyproject.toml agree; a release tag matches them
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          manifest=$(python -c "import json;print(json.load(open('custom_components/petra_tracker/manifest.json'))['version'])")
          project=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "manifest=$manifest pyproject=$project ref=$REF_TYPE/$REF_NAME"
          [ "$manifest" = "$project" ] || { echo "::error::manifest.json ($manifest) != pyproject.toml ($project)"; exit 1; }
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "v$manifest" ]; then
            echo "::error::tag $REF_NAME does not match manifest version v$manifest — bump the version before tagging"
            exit 1
          fi

  hygiene:
    name: Public-repo hygiene (no real data / secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python tools/check_public_hygiene.py

  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install pytest-homeassistant-custom-component ruff
      - run: ruff check .
      - run: python -m pytest -q

  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Brand icons are only needed for the HACS default list, not custom repositories.
          ignore: brands
